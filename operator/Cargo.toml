[package]
name = "artifactory-operator"
version.workspace = true
edition.workspace = true
rust-version = "1.95.0"
[dependencies]
artifactory-runtime-protocol = { path = "../crates/runtime-protocol" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
kube = { version = "=5.0.0", features = ["runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "=0.29.0", features = ["v1_37", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
