name: artifactory
services:
  postgres:
    image: timescale/timescaledb:2.32.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: ${ARTIFACTORY_DATABASE_PASSWORD:?run scripts/init-deploy.sh}
      TIMESCALEDB_TELEMETRY: 'off'
      ARTIFACTORY_TELEMETRY_DATABASE_PASSWORD: ${ARTIFACTORY_TELEMETRY_DATABASE_PASSWORD:?run scripts/init-deploy.sh}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/timescale-init.sh:/docker-entrypoint-initdb.d/100_artifactory.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U artifactory -d artifactory]
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    entrypoint: [/bin/sh, /run/artifactory-s3-entrypoint.sh]
    command: [mini, -dir=/data, -s3.port=8333, -s3.config=/run/artifactory-s3/s3.json, -s3.iam.readOnly=true, -admin.ui=false, -ip.bind=0.0.0.0]
    volumes:
      - objects:/data
      - ./.deploy/s3.json:/etc/seaweed/s3.json:ro
      - ./deploy/seaweed-entrypoint.sh:/run/artifactory-s3-entrypoint.sh:ro
  control-plane:
    build: .
    restart: unless-stopped
    user: ${ARTIFACTORY_UID:-10001}:${ARTIFACTORY_GID:-10001}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DATABASE_URL: postgres://artifactory:${ARTIFACTORY_DATABASE_PASSWORD}@postgres:5432/artifactory
      ARTIFACTORY_HTTP_BIND: 0.0.0.0:8080
      ARTIFACTORY_GRPC_BIND: 0.0.0.0:8443
      ARTIFACTORY_PUBLIC_URL: https://${ARTIFACTORY_DOMAIN:?set ARTIFACTORY_DOMAIN}
      ARTIFACTORY_REGISTRATION_ENABLED: ${ARTIFACTORY_REGISTRATION_ENABLED:-true}
      ARTIFACTORY_MASTER_KEY: ${ARTIFACTORY_MASTER_KEY:?run scripts/init-deploy.sh}
      ARTIFACTORY_PKI_DIR: /run/artifactory-pki
      ARTIFACTORY_DATA_DIR: /var/lib/artifactory
      ARTIFACTORY_S3_ENDPOINT: https://${ARTIFACTORY_S3_DOMAIN:?set ARTIFACTORY_S3_DOMAIN}
      ARTIFACTORY_S3_PUBLIC_ENDPOINT: https://${ARTIFACTORY_S3_DOMAIN}
      ARTIFACTORY_S3_BUCKET: artifactory
      ARTIFACTORY_S3_REGION: us-east-1
      ARTIFACTORY_S3_ACCESS_KEY: ${ARTIFACTORY_S3_ACCESS_KEY}
      ARTIFACTORY_S3_SECRET_KEY: ${ARTIFACTORY_S3_SECRET_KEY}
      ARTIFACTORY_BOOTSTRAP_USERNAME: ${ARTIFACTORY_BOOTSTRAP_USERNAME:-admin}
      ARTIFACTORY_BOOTSTRAP_PASSWORD: ${ARTIFACTORY_BOOTSTRAP_PASSWORD:?run scripts/init-deploy.sh}
      ARTIFACTORY_TELEMETRY_ENDPOINT: https://${ARTIFACTORY_GRPC_HOST}:8444
      ARTIFACTORY_TELEMETRY_URL: https://telemetry:8093
      ARTIFACTORY_TELEMETRY_TOKEN: ${ARTIFACTORY_TELEMETRY_TOKEN}
    volumes:
      - ./.deploy/pki:/run/artifactory-pki:ro
      - ./.deploy/control-plane:/var/lib/artifactory
    ports:
      - ${ARTIFACTORY_GRPC_LISTEN:-0.0.0.0}:8443:8443
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
  telemetry:
    build: .
    restart: unless-stopped
    entrypoint: [artifactory-telemetry-service]
    user: ${ARTIFACTORY_UID:-10001}:${ARTIFACTORY_GID:-10001}
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_started
    environment:
      DATABASE_URL: postgres://artifactory_telemetry:${ARTIFACTORY_TELEMETRY_DATABASE_PASSWORD}@postgres:5432/artifactory_telemetry
      ARTIFACTORY_BUSINESS_DATABASE_URL: postgres://artifactory:${ARTIFACTORY_DATABASE_PASSWORD}@postgres:5432/artifactory
      ARTIFACTORY_TELEMETRY_TOKEN: ${ARTIFACTORY_TELEMETRY_TOKEN}
      ARTIFACTORY_TELEMETRY_HTTP_BIND: 0.0.0.0:8093
      ARTIFACTORY_TELEMETRY_GRPC_BIND: 0.0.0.0:8444
      ARTIFACTORY_PKI_DIR: /run/artifactory-pki
      ARTIFACTORY_SERVICE_TLS_CERT: /run/artifactory-pki/server.pem
      ARTIFACTORY_SERVICE_TLS_KEY: /run/artifactory-pki/server.key
    volumes:
      - ./.deploy/pki/ca.pem:/run/artifactory-pki/ca.pem:ro
      - ./.deploy/pki/server.pem:/run/artifactory-pki/server.pem:ro
      - ./.deploy/pki/server.key:/run/artifactory-pki/server.key:ro
    ports:
      - ${ARTIFACTORY_GRPC_LISTEN:-0.0.0.0}:8444:8444
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on: [control-plane]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  agent-worker:
    build:
      context: .
      dockerfile: packages/agent-worker/Dockerfile
    restart: unless-stopped
    user: ${ARTIFACTORY_UID:-10001}:${ARTIFACTORY_GID:-10001}
    depends_on: [control-plane]
    environment:
      ARTIFACTORY_AI_ENDPOINT: control-plane:8443
      ARTIFACTORY_AI_SERVER_NAME: ${ARTIFACTORY_GRPC_HOST}
      ARTIFACTORY_AI_CA_FILE: /run/artifactory-pki/ca.pem
    volumes:
      - ./.deploy/pki/ca.pem:/run/artifactory-pki/ca.pem:ro
      - ./.deploy/agent-worker:/var/lib/artifactory-agent-worker
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ARTIFACTORY_DOMAIN: ${ARTIFACTORY_DOMAIN}
      ARTIFACTORY_S3_DOMAIN: ${ARTIFACTORY_S3_DOMAIN}
    ports: [80:80, 443:443]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, s3]
volumes:
  postgres:
  objects:
  caddy_data:
  caddy_config:
