name: artifact-kit
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artifact
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: ${AK_DATABASE_PASSWORD:?run scripts/init-deploy.sh}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U artifact -d artifact]
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command: [mini, -dir=/data, -s3.port=8333, -s3.config=/etc/seaweed/s3.json, -s3.iam.readOnly=true, -admin.ui=false, -ip.bind=0.0.0.0]
    volumes:
      - objects:/data
      - ./.deploy/s3.json:/etc/seaweed/s3.json:ro
  control:
    build: .
    restart: unless-stopped
    user: ${AK_UID:-10001}:${AK_GID:-10001}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DATABASE_URL: postgres://artifact:${AK_DATABASE_PASSWORD}@postgres:5432/artifact
      AK_HTTP_BIND: 0.0.0.0:8080
      AK_GRPC_BIND: 0.0.0.0:8443
      AK_PUBLIC_URL: https://${AK_DOMAIN:?set AK_DOMAIN}
      AK_MASTER_KEY: ${AK_MASTER_KEY:?run scripts/init-deploy.sh}
      AK_PKI_DIR: /run/artifact-pki
      AK_DATA_DIR: /var/lib/artifact
      AK_S3_ENDPOINT: https://${AK_S3_DOMAIN:?set AK_S3_DOMAIN}
      AK_S3_PUBLIC_ENDPOINT: https://${AK_S3_DOMAIN}
      AK_S3_BUCKET: artifact-kit
      AK_S3_REGION: us-east-1
      AK_S3_ACCESS_KEY: ${AK_S3_ACCESS_KEY}
      AK_S3_SECRET_KEY: ${AK_S3_SECRET_KEY}
      AK_BOOTSTRAP_USERNAME: ${AK_BOOTSTRAP_USERNAME:-admin}
      AK_BOOTSTRAP_PASSWORD: ${AK_BOOTSTRAP_PASSWORD:?run scripts/init-deploy.sh}
    volumes:
      - ./.deploy/pki:/run/artifact-pki:ro
      - ./.deploy/control:/var/lib/artifact
    ports:
      - ${AK_GRPC_LISTEN:-0.0.0.0}:8443:8443
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=1g,mode=1777]
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [control]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AK_DOMAIN: ${AK_DOMAIN}
      AK_S3_DOMAIN: ${AK_S3_DOMAIN}
    ports: [80:80, 443:443]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, s3]
volumes:
  postgres:
  objects:
  caddy_data:
  caddy_config:
