syntax = "proto3";
package artifactory.emissary.v1;

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollReply);
}

service Control {
  rpc Connect(stream EmissaryEvent) returns (stream Command);
  rpc UploadLogs(stream LogChunk) returns (LogAck);
  rpc PrepareArtifact(ArtifactRequest) returns (UploadTicket);
  rpc CompleteArtifact(CompleteArtifactRequest) returns (ArtifactRecord);
}

// A separate endpoint, database and flow-control budget from execution traffic.
service Telemetry {
  rpc Upload(TelemetryBatch) returns (TelemetryAck);
}
message TelemetryBatch { bytes json = 1; }
message TelemetryAck {
  string batch_id = 1;
  bool duplicate = 2;
  int64 server_time_ms = 3;
}

service PlannerEnrollment {
  rpc Enroll(PlannerEnrollRequest) returns (PlannerEnrollReply);
}
message PlannerEnrollReply {
  string worker_id = 1;
  string certificate_pem = 2;
  string ca_pem = 3;
  uint32 heartbeat_seconds = 4;
  uint32 lease_seconds = 5;
}
service Planning {
  rpc Poll(PlannerPollRequest) returns (PlannerTask);
  rpc Heartbeat(PlannerLeaseRequest) returns (PlannerHeartbeat);
  rpc Tool(PlannerToolRequest) returns (PlannerToolReply);
  rpc Report(PlannerReportRequest) returns (PlannerToolReply);
}
message PlannerEnrollRequest {
  string token = 1;
  string name = 2;
  string csr_pem = 3;
}
message PlannerPollRequest {}
message PlannerTask {
  string run_id = 1;
  string lease_token = 2;
  string context_json = 3;
  string model_config_json = 4;
  uint32 timeout_seconds = 5;
  uint32 max_calls = 6;
}
message PlannerLeaseRequest { string run_id = 1; string lease_token = 2; }
message PlannerHeartbeat { bool canceled = 1; }
message PlannerToolRequest {
  string run_id = 1;
  string lease_token = 2;
  string name = 3;
  string arguments_json = 4;
}
message PlannerToolReply { string result_json = 1; }
message PlannerReportRequest {
  string run_id = 1;
  string lease_token = 2;
  string kind = 3;
  string payload_json = 4;
}

message EnrollRequest {
  string token = 1;
  string name = 2;
  string os = 3;
  string arch = 4;
  string csr_pem = 5;
  uint32 protocol_major = 6;
}
message EnrollReply {
  string emissary_id = 1;
  string certificate_pem = 2;
  string ca_pem = 3;
  uint32 heartbeat_seconds = 4;
  uint32 lease_seconds = 5;
  string telemetry_endpoint = 6;
}
message EmissaryEvent {
  string emissary_id = 1;
  string kind = 2;
  string attempt_id = 3;
  string lease_token = 4;
  uint64 sequence = 5;
  string command_id = 6;
  string payload_json = 7;
  uint32 protocol_major = 8;
}
message Step {
  string name = 1;
  string phase = 2;
  string shell = 3;
  string run = 4;
  uint32 timeout_seconds = 5;
}
message GitCredential {
  string kind = 1;
  string username = 2;
  string secret = 3;
  string known_hosts = 4;
}
message Assignment {
  string job_id = 1;
  string build_id = 2;
  string target = 3;
  string repository_url = 4;
  string commit_sha = 5;
  repeated Step steps = 6;
  repeated string artifacts = 7;
  map<string, string> environment = 8;
  repeated string signing_profiles = 9;
  GitCredential git_credential = 10;
  uint32 timeout_seconds = 11;
  SourceDescriptor source = 12;
  string plan_revision_id = 13;
  repeated ExternalScript scripts = 14;
}
message ExternalScript { string name = 1; string content = 2; string sha256 = 3; }
message SourceRepository {
  string path = 1;
  string repository_id = 2;
  string commit_sha = 3;
  string git_url = 4;
  string lfs_url = 5;
  bool has_lfs = 6;
  map<string,string> tags = 7;
  string cache_id = 8;
}
message SourceDescriptor {
  string snapshot_id = 1;
  string access_token = 2;
  repeated SourceRepository repositories = 3;
}
message Command {
  string command_id = 1;
  string kind = 2;
  string attempt_id = 3;
  string lease_token = 4;
  uint32 lease_seconds = 5;
  Assignment assignment = 6;
  string message = 7;
  string request_id = 8;
  uint64 ack_sequence = 9;
  // Emissary-level commands (emissary_update / emissary_health) have no attempt ID.
  // OTA v1 is negotiated by the emissary-ota-v1 hello capability; protocol stays 1.
  string payload_json = 10;
}
message LogChunk {
  string attempt_id = 1;
  string lease_token = 2;
  uint64 sequence = 3;
  string step = 4;
  bytes data = 5;
}
message LogAck { uint64 through_sequence = 1; }
message ArtifactRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string path = 3;
  uint64 size = 4;
  string sha256 = 5;
}
message UploadTicket {
  string upload_id = 1;
  string url = 2;
  uint32 expires_seconds = 3;
}
message CompleteArtifactRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string upload_id = 3;
}
message ArtifactRecord {
  string artifact_id = 1;
  string path = 2;
  string sha256 = 3;
  uint64 size = 4;
}
