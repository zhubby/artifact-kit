{{- range $component := list "control" "postgres" "s3" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "artifact-kit.fullname" $ }}-{{ $component }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "artifact-kit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if eq $.Values.persistence.storageClass "-" }}
  storageClassName: ""
  {{- else if $.Values.persistence.storageClass }}
  storageClassName: {{ $.Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ index $.Values.persistence $component | quote }}
{{- end }}
