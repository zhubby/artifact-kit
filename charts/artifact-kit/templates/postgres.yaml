apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifact-kit.fullname" . }}-postgres
  labels:
    {{- include "artifact-kit.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "artifact-kit.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "artifact-kit.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          securityContext:
            {{- include "artifact-kit.containerSecurity" . | nindent 12 }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: artifact}
            - {name: POSTGRES_USER, value: artifact}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "artifact-kit.credentials" . }}
                  key: database-password
          startupProbe:
            exec: {command: [pg_isready, -U, artifact, -d, artifact]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, artifact, -d, artifact]}
          livenessProbe:
            exec: {command: [pg_isready, -U, artifact, -d, artifact]}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "artifact-kit.fullname" . }}-postgres
        - {name: run, emptyDir: {sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
