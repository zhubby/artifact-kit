# Local development only. Bind browser/Agent URLs to the actual node IP when
# using NodePorts, or port-forward these same ports to 127.0.0.1.
development:
  insecureHttp: true
console:
  publicUrl: http://127.0.0.1:31080
  service:
    type: NodePort
    nodePort: 31080
grpc:
  service:
    type: NodePort
    nodePort: 31443
s3:
  publicEndpoint: http://127.0.0.1:31333
  service:
    type: NodePort
    nodePort: 31333
persistence:
  storageClass: standard
  control: 1Gi
  postgres: 1Gi
  s3: 2Gi
