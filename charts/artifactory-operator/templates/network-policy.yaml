{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-pi
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: artifactory-pi}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: artifactory-runtime}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: artifactory-source}
      ports: [{port: 8090, protocol: TCP}, {port: 8091, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
