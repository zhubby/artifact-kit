apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-s3
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: s3
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: s3
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: s3
          image: "{{ .Values.images.s3.repository }}:{{ .Values.images.s3.tag }}"
          imagePullPolicy: {{ .Values.images.s3.pullPolicy }}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          args: [mini, -dir=/data, -s3.port=8333, -s3.config=/run/artifactory-s3/s3.json, -s3.iam.readOnly=true, -admin.ui=false, -ip.bind=0.0.0.0]
          ports:
            - {name: s3, containerPort: 8333}
          startupProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: s3}
          livenessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.s3 | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: credentials, mountPath: /run/artifactory-s3, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "artifactory.fullname" . }}-s3
        - name: credentials
          secret:
            secretName: {{ include "artifactory.credentials" . }}
            defaultMode: 0440
            items:
              - {key: s3.json, path: s3.json}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
