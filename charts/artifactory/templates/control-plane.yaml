{{- if and (gt (int .Values.controlPlane.replicas) 1) (not .Values.localSource.enabled) }}
{{- fail "controlPlane.replicas > 1 requires localSource.enabled=true to retain legacy source data on its own volume" }}
{{- end }}
{{- $root := . }}
{{- $components := list "control-plane" }}
{{- if .Values.localSource.enabled }}{{- $components = append $components "local-source" }}{{- end }}
{{- range $component := $components }}
{{- with $root }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-{{ $component }}
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary .Values.controlPlane.replicas 1 (eq $component "control-plane") }}
  strategy:
    {{- if and (eq $component "control-plane") .Values.localSource.enabled }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podPreemptionPolicy }}
      preemptionPolicy: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 45
      {{- if and (eq $component "control-plane") (gt (int .Values.controlPlane.replicas) 1) }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: control-plane
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component }}
          image: "{{ (index .Values.images "control-plane").repository }}:{{ (index .Values.images "control-plane").tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ (index .Values.images "control-plane").pullPolicy }}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          {{- if eq $component "local-source" }}
          command: [artifactory-control-plane, serve-source]
          {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 8443}
          envFrom:
            - configMapRef:
                name: {{ include "artifactory.fullname" . }}-config
            {{- if .Values.planning.runtimeUrl }}
            - secretRef:
                name: {{ required "planning.serviceSecretName is required with Runtime" .Values.planning.serviceSecretName }}
            {{- end }}
          env:
            {{- if eq $component "local-source" }}
            - {name: ARTIFACTORY_SERVICE_TLS_CERT, value: /run/artifactory-pki/server.pem}
            - {name: ARTIFACTORY_SERVICE_TLS_KEY, value: /run/artifactory-pki/server.key}
            {{- end }}
            {{- if .Values.controlPlane.releaseSourceConfigMap }}
            - {name: ARTIFACTORY_EMISSARY_RELEASE_SOURCE, value: /etc/artifactory/emissary-releases.json}
            {{- end }}
            {{- $secret := include "artifactory.credentials" . }}
            {{- if .Values.telemetry.enabled }}
            - name: ARTIFACTORY_TELEMETRY_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: telemetry-token}
            {{- end }}
            {{- range $env, $key := dict "DATABASE_URL" "database-url" "ARTIFACTORY_MASTER_KEY" "master-key" "ARTIFACTORY_S3_ACCESS_KEY" "s3-access-key" "ARTIFACTORY_S3_SECRET_KEY" "s3-secret-key" "ARTIFACTORY_BOOTSTRAP_USERNAME" "bootstrap-username" "ARTIFACTORY_BOOTSTRAP_PASSWORD" "bootstrap-password" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ ternary "HTTPS" "HTTP" (eq $component "local-source") }}}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: {{ ternary "HTTPS" "HTTP" (eq $component "local-source") }}}
          livenessProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ ternary "HTTPS" "HTTP" (eq $component "local-source") }}}
            periodSeconds: 15
          resources:
            {{- toYaml (index .Values.resources "control-plane") | nindent 12 }}
          volumeMounts:
            {{- if .Values.controlPlane.releaseSourceConfigMap }}
            - {name: release-source, mountPath: /etc/artifactory, readOnly: true}
            {{- end }}
            - {name: data, mountPath: /var/lib/artifactory}
            - {name: pki, mountPath: /run/artifactory-pki, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.planning.serviceCaSecretName }}
            - {name: service-ca, mountPath: /run/service-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.planning.serviceCaSecretName }}
        - name: service-ca
          secret:
            secretName: {{ .Values.planning.serviceCaSecretName }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if .Values.controlPlane.releaseSourceConfigMap }}
        - name: release-source
          configMap:
            name: {{ .Values.controlPlane.releaseSourceConfigMap }}
            items: [{key: emissary-releases.json, path: emissary-releases.json}]
        {{- end }}
        - name: data
          {{- if and (eq $component "control-plane") .Values.localSource.enabled }}
          emptyDir: {sizeLimit: {{ .Values.controlPlane.temporaryStorage }}}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "artifactory.fullname" . }}-control-plane
          {{- end }}
        - name: pki
          secret:
            secretName: {{ include "artifactory.pki" . }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}

{{- end }}
{{- end }}
{{- if gt (int .Values.controlPlane.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "artifactory.fullname" . }}-control-plane
spec:
  minAvailable: {{ sub (int .Values.controlPlane.replicas) 1 }}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
{{- end }}
