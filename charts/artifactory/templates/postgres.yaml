{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-postgres
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          args: [postgres, -c, "max_connections={{ int .Values.postgres.maxConnections }}"]
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: artifactory}
            - {name: POSTGRES_USER, value: artifactory}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: TIMESCALEDB_TELEMETRY, value: 'off'}
            - name: ARTIFACTORY_TELEMETRY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "artifactory.credentials" . }}, key: telemetry-database-password}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "artifactory.credentials" . }}
                  key: database-password
          startupProbe:
            exec: {command: [pg_isready, -U, artifactory, -d, artifactory]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, artifactory, -d, artifactory]}
          livenessProbe:
            exec: {command: [pg_isready, -U, artifactory, -d, artifactory]}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d/100_artifactory.sh, subPath: init.sh, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: init
          configMap: {name: {{ include "artifactory.fullname" . }}-timescale-init}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "artifactory.fullname" . }}-postgres
        - {name: run, emptyDir: {sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 128Mi}}

{{- end }}
