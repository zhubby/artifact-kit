{{- if .Values.aiWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-ai-worker
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: ai-worker
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: ai-worker
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ai-worker
          {{- $image := index .Values.images "ai-worker" }}
          image: "{{ $image.repository }}:{{ $image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          env:
            - name: ARTIFACTORY_AI_ENDPOINT
              value: {{ printf "%s-grpc:8443" (include "artifactory.fullname" .) | quote }}
            - name: ARTIFACTORY_AI_SERVER_NAME
              value: {{ .Values.aiWorker.serverName | default (printf "%s-grpc" (include "artifactory.fullname" .)) | quote }}
            - name: ARTIFACTORY_AI_CA_FILE
              value: /run/artifactory-pki/ca.pem
          resources:
            {{- toYaml (index .Values.resources "ai-worker") | nindent 12 }}
          volumeMounts:
            - {name: identity, mountPath: /var/lib/artifactory-ai-worker}
            - {name: ca, mountPath: /run/artifactory-pki, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          persistentVolumeClaim:
            claimName: {{ include "artifactory.fullname" . }}-ai-worker
        - name: ca
          secret:
            secretName: {{ include "artifactory.pki" . }}
            defaultMode: 0440
            items: [{key: ca.pem, path: ca.pem}]
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
{{- end }}
