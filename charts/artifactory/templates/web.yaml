apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-web
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podPreemptionPolicy }}
      preemptionPolicy: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - {name: web-tmp, mountPath: /tmp}
            - {name: web-cache, mountPath: /app/.next/cache}
        # Route API/SSE before Next's build-time rewrites. All public traffic
        # enters this gateway, so image builds do not depend on Helm DNS names.
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          command: [caddy]
          args: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - {name: XDG_CONFIG_HOME, value: /tmp/config}
            - {name: XDG_DATA_HOME, value: /tmp/data}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          ports:
            - {name: gateway, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: gateway}
          livenessProbe:
            tcpSocket: {port: gateway}
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          volumeMounts:
            {{- if .Values.localSource.enabled }}
            - {name: pki, mountPath: /run/pki, readOnly: true}
            {{- end }}
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: gateway-tmp, mountPath: /tmp}
      volumes:
        {{- if .Values.localSource.enabled }}
        - name: pki
          secret:
            secretName: {{ include "artifactory.pki" . }}
            items: [{key: ca.pem, path: ca.pem}]
        {{- end }}
        - name: config
          configMap:
            name: {{ include "artifactory.fullname" . }}-config
            items:
              - {key: Caddyfile, path: Caddyfile}
        - {name: web-tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: web-cache, emptyDir: {sizeLimit: 128Mi}}
        - {name: gateway-tmp, emptyDir: {sizeLimit: 16Mi}}
