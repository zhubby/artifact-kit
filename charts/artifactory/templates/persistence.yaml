{{- $components := list "control" }}
{{- if .Values.postgres.enabled }}{{- $components = append $components "postgres" }}{{- end }}
{{- if .Values.s3.enabled }}{{- $components = append $components "s3" }}{{- end }}
{{- if .Values.aiWorker.enabled }}{{- $components = append $components "ai-worker" }}{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "artifactory.fullname" $ }}-{{ $component }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "artifactory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if eq $.Values.persistence.storageClass "-" }}
  storageClassName: ""
  {{- else if $.Values.persistence.storageClass }}
  storageClassName: {{ $.Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ index $.Values.persistence $component | quote }}
{{- end }}
