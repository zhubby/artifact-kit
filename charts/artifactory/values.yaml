# The release name is the resource prefix. PostgreSQL fences concurrent dispatchers.
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}

images:
  control-plane:
    repository: ghcr.io/zhubby/artifactory-control-plane
    tag: "" # Defaults to Chart.appVersion; set this to a published release tag.
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/zhubby/artifactory-web
    tag: ""
    pullPolicy: IfNotPresent
  agent-worker:
    repository: ghcr.io/zhubby/artifactory-agent-worker
    tag: ""
    pullPolicy: IfNotPresent
  gateway:
    repository: caddy
    tag: 2-alpine
    pullPolicy: IfNotPresent
  postgres:
    repository: timescale/timescaledb
    tag: 2.32.0-pg17
    pullPolicy: IfNotPresent
  s3:
    repository: chrislusf/seaweedfs
    tag: "4.53"
    pullPolicy: IfNotPresent

# Created separately by scripts/init-helm.py, never generated during upgrades.
# Empty names select <release>-credentials and <release>-pki.
secrets:
  credentials: ""
  pki: ""

controlPlane:
  replicas: 1
  databaseConnections: 20
  artifactVerifications: 4
  schedulerBatch: 64
  # Enable only after Control, Telemetry, Runtime, Worker and Emissary are upgraded.
  aiPlacement: false
  drainSeconds: 5
  temporaryStorage: 10Gi
  # Optional ConfigMap containing emissary-releases.json; mounted on every replica.
  releaseSourceConfigMap: ""
localSource:
  # Required before setting controlPlane.replicas > 1. Retains the existing control PVC.
  enabled: false
postgres:
  enabled: true
  maxConnections: 100

auth:
  registrationEnabled: true

console:
  publicUrl: https://build.example.com
  service:
    type: ClusterIP
    nodePort: null

grpc:
  service:
    type: ClusterIP
    nodePort: null

telemetry:
  enabled: true
  replicas: 1
  writeConnections: 12
  readConnections: 4
  authorizationConnections: 4
  # Device-reachable TLS endpoint. Include this host in init-helm.py --grpc-host.
  endpoint: https://build.example.com:8444
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '2', memory: 512Mi}

s3:
  enabled: true
  # Production uses the reachable HTTPS endpoint, including from control pods.
  # In development, an empty endpoint selects the internal HTTP service.
  endpoint: ""
  publicEndpoint: https://artifacts.example.com
  bucket: artifactory
  region: us-east-1
  service:
    type: ClusterIP
    nodePort: null

development:
  insecureHttp: false

agentWorker:
  enabled: true
  serverName: "" # Defaults to the internal gRPC service certificate SAN.

sourceCache:
  maxBytes: "4294967296"

ingress:
  enabled: false
  className: ""
  annotations: {}
  consoleHost: build.example.com
  s3Host: artifacts.example.com
  consoleTlsSecret: artifactory-console-tls
  s3TlsSecret: artifactory-s3-tls

# PVCs survive helm uninstall; removing a namespace still deletes its PVCs.
persistence:
  storageClass: "" # Use the cluster default; "-" disables dynamic provisioning.
  control-plane: 5Gi
  postgres: 5Gi
  s3: 20Gi
  agent-worker: 1Gi

resources:
  control-plane:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "2", memory: 512Mi}
  web:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  agent-worker:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  gateway:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  postgres:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  s3:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}

# Runtime/Source are installed by the separate artifactory-operator release.
# Opt in per project using planner_backend=kubernetes after verification.
planning:
  runtimeUrl: ""
  sourceUrls: ""
  agentPool: default
  serviceSecretName: ""
  serviceCaSecretName: ""
