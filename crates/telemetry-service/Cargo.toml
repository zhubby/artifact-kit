[package]
name = "artifactory-telemetry-service"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
artifactory-database = { path = "../database" }
artifactory-emissary-protocol = { path = "../emissary-protocol" }
artifactory-runtime-protocol = { path = "../runtime-protocol" }
artifactory-telemetry-model = { path = "../telemetry-model" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toasty.workspace = true
jiff.workspace = true
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rcgen = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
