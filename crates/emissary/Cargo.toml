[package]
name = "artifactory-emissary"
version.workspace = true
edition.workspace = true
default-run = "artifactory-emissary"

[dependencies]
artifactory-emissary-protocol = { path = "../emissary-protocol" }
artifactory-telemetry-model = { path = "../telemetry-model" }
anyhow = "1"
base64 = "0.22"
cap-std = "4"
cap-fs-ext = "4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
ed25519-dalek = "2"
fs2 = "0.4"
futures = "0.3"
globset = "0.4"
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
process-wrap = { version = "10", features = ["tokio1"] }
rcgen = { version = "0.14", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "network"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
which = "8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
toasty.workspace = true
artifactory-database = { path = "../database" }

[[bin]]
name = "emissary-release"
path = "src/bin/emissary-release.rs"
