[package]
name = "artifactory-source-core"
version.workspace = true
edition.workspace = true
[dependencies]
artifactory-database = { path = "../database" }
artifactory-runtime-protocol = { path = "../runtime-protocol" }
anyhow = "1"
chrono = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toasty.workspace = true
jiff.workspace = true
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
