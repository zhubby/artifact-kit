name: web-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish Web image for Kubernetes (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable source identity
        id: source
        shell: bash
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/artifactory-web"
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$(cat VERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing image of this commit
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" > "$RUNNER_TEMP/web-image.txt" 2> "$RUNNER_TEMP/web-image-error.txt"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/web-image.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            grep -Eqi 'not found|manifest unknown|manifest_unknown' "$RUNNER_TEMP/web-image-error.txt"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish the committed Web source
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.image }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          cache-from: type=gha,scope=release-web-amd64
          cache-to: type=gha,mode=max,scope=release-web-amd64
      - name: Record the published digest
        if: steps.build.outputs.digest != ''
        shell: bash
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
